name: release

# Push a tag like v1.0.0 to build the APK and publish it as a GitHub Release.
# The APK is signed with your release key when these repository secrets exist:
#   LIBREAD_KEYSTORE_BASE64  (base64 of the .jks file)
#   LIBREAD_KEYSTORE_PASSWORD, LIBREAD_KEY_ALIAS, LIBREAD_KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIBREAD_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LIBREAD_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          LIBREAD_KEYSTORE_PASSWORD: ${{ secrets.LIBREAD_KEYSTORE_PASSWORD }}
          LIBREAD_KEY_ALIAS: ${{ secrets.LIBREAD_KEY_ALIAS }}
          LIBREAD_KEY_PASSWORD: ${{ secrets.LIBREAD_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk libread.apk
          sha256sum libread.apk > libread.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libread.apk
            libread.apk.sha256
          generate_release_notes: true
